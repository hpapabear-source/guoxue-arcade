  </div>`)}
function teacherHTML(){const data=st.teacherData;const users=data?.users||[],opened=data?.maps||st.open;return shellHTML(`<div class="h-head"><div class="kicker">ARCADE CONTROL CENTER</div><h1>🛡️ 管理者後台</h1><p>設定地圖開放狀態，管理訪客勇者。管理者試玩不計入排行榜。題目與答案可至獨立 Supabase 的 gx_questions 修改。</p><div style="margin-top:13px"><button class="btn gold" data-action="nav" data-value="map">🎮 切換管理者試玩視角</button></div></div><div class="teacher-stats"><div class="teacher-stat"><small class="muted">最近勇者數</small><b>${users.length}${data?.usersLimited?'+':''}</b></div><div class="teacher-stat"><small class="muted">題庫題數</small><b>${data?.countBank||0}</b></div><div class="teacher-stat"><small class="muted">開放地圖</small><b>${Object.values(opened).filter(Boolean).length}/8</b></div></div><div class="card card-pad" style="margin-bottom:18px"><div class="small-title">地圖開放管理</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px">${st.maps.map(m=>`<div class="settings-row"><b>${esc(m.icon)} ${esc(m.name)}</b><button class="btn small ${opened[m.id]?'light':'red'}" data-action="toggle-map" data-value="${m.id}">${opened[m.id]?'已開放':'未開放'}</button></div>`).join('')}</div></div><div class="card card-pad"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between"><h3 class="aside-title" style="margin:0">訪客勇者紀錄（最近最多500筆）</h3><button class="btn light" data-action="admin-refresh">↻ 更新資料</button></div><div class="teacher-table-wrap"><table class="teachertable"><thead><tr><th>訪客編號</th><th>暱稱</th><th>最高總分</th><th>通關</th><th>挑戰次數</th><th>管理</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.id)}</td><td><b>${esc(u.name)}</b></td><td>${u.total}</td><td>${Object.keys(u.cleared||{}).filter(k=>Number(k)<=7&&u.cleared[k]).length}/7</td><td>${Object.values(u.attempts||{}).reduce((a,b)=>a+Number(b||0),0)}</td><td><div class="teacher-actions"><button class="btn ghost small" data-action="admin-rename" data-value="${esc(u.id)}">改暱稱</button><button class="btn light small" data-action="admin-reset" data-value="${esc(u.id)}">重置</button><button class="btn red small" data-action="admin-delete" data-value="${esc(u.id)}">刪除</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">尚無玩家資料</td></tr>'}</tbody></table></div><div class="info">玩家憑證只保存在裝置瀏覽器內；管理操作會直接影響該玩家的進度與排行榜。公開試玩前請檢查題數及後台密碼。</div></div>`)}
function dialogHTML(){const r=st.run;if(!st.dialog)return '';const d=st.dialog;const x=(str)=>esc(str);if(d.kind==='sidePick')return `<div class="overlay" id="overlay"><div class="dialog"><div class="dialogicon">🎁</div><div class="kicker">OPTIONAL QUEST · 支線任務</div><h2>尋找傳說神器</h2><p>選擇想獲得的神器，再挑戰一道額外題。每張地圖<strong>總共只能挑戰兩次</strong>，即使答錯或重新闖關都計入次數。支線期間主線計時暫停。</p><div class="side-options">${Object.entries(ITEMS).map(([key,it])=>`<button data-action="side-start" data-value="${key}">${it[0]} <strong>${it[1]}</strong> · ${it[2]}</button>`).join('')}</div><div class="actionrow"><button class="btn ghost full" data-action="dialog-close">回到主線</button></div></div></div>`;
if(d.kind==='side')return `<div class="overlay"><div class="dialog"><div class="kicker">SIDE QUEST · 支線題庫</div><h2>${ITEMS[r.side.item][0]} ${ITEMS[r.side.item][1]}</h2><p class="side-question">${x(r.side.text)}</p><div class="side-options">${r.side.options.map((opt,i)=>`<button data-action="side-answer" data-value="${i}">（${'ABCD'[i]}）${x(opt)}</button>`).join('')}</div><button style="margin-top:15px" class="btn ghost full" data-action="side-cancel">放棄支線（仍計入一次）</button></div></div>`;
if(d.kind==='feedback')return `<div class="overlay"><div class="dialog" style="text-align:center"><div class="dialogicon">${d.correct?'🎉':d.timeout?'⌛':'💔'}</div><div class="kicker">${d.correct?'CORRECT':'TRY AGAIN NEXT TIME'}</div><h2>${d.correct?'答對了！':d.timeout?'時間到！':'答錯了！'}</h2><p>${d.correct?`這題得到 <b>${d.gained} 分</b>、獲得 <b>${d.coins} 金幣</b>。`:'失去一顆愛心，不公布正確答案。'}</p>${r?.status==='dead'?'<p>體力已歸零，這張地圖從頭開始；已通關的其他地圖及已領取的寶物保留。</p>':''}${r?.status==='clear'?`<div class="big-score">${r.score} 分</div><p>恭喜完成「${x(currentMap().name)}」！${d.isBest?'刷新個人最高分！':''}${d.firstClear?'首次通關，額外獲得一張改名券。':''}</p>`:''}<div class="actionrow">${r?.status==='dead'?`<button class="btn gold" data-action="restart">⚔️ 重闖本張地圖</button><button class="btn ghost" data-action="back-map">返回地圖</button>`:r?.status==='clear'?`<button class="btn primary" data-action="back-map">🏆 返回地圖</button><button class="btn ghost" data-action="restart">再挑戰最高分</button>`:`<button class="btn primary full" data-action="dialog-next">繼續冒險 →</button>`}</div></div></div>`;
if(d.kind==='sideResult')return `<div class="overlay"><div class="dialog" style="text-align:center"><div class="dialogicon">${d.correct?'✨':'🌫️'}</div><h2>${d.correct?'挑戰成功，獲得神器！':'額外挑戰失敗'}</h2><p>${d.correct?`獲得「${ITEMS[d.item][1]}」一件，已放入背包。`:'不會公布正確答案。這次支線挑戰已計入使用次數。'}</p><button class="btn primary full" data-action="side-result-close">返回闖關</button></div></div>`;
if(d.kind==='rename')return `<div class="overlay"><div class="dialog"><h2>🎟️ 使用改名券</h2><p>每張地圖首次通關可獲得一次改名機會。目前剩餘 ${st.player?.tickets} 張。</p><form id="renameForm"><label class="f-label">新的冒險暱稱<input name="name" maxlength="12" required value="${x(st.player?.name||'')}"></label><div class="actionrow"><button class="btn primary" type="submit">確認改名</button><button class="btn ghost" type="button" data-action="dialog-close">取消</button></div></form></div></div>`;
if(d.kind==='adminRename')return `<div class="overlay"><div class="dialog"><h2>✎ 修改勇者暱稱</h2><form id="adminForm"><input type="hidden" name="id" value="${x(d.id||'')}"><label class="f-label">新的暱稱<input name="name" maxlength="12" required value="${x(d.name||'')}"></label><div class="actionrow"><button class="btn primary" type="submit">儲存資料</button><button class="btn ghost" type="button" data-action="dialog-close">取消</button></div></form></div></div>`;
if(d.kind==='confirm')return `<div class="overlay"><div class="dialog"><div class="dialogicon">⚠️</div><h2>${d.action==='delete'?'確定刪除勇者紀錄？':'確定重設挑戰成績？'}</h2><p>訪客編號：${x(d.id)}。${d.action==='delete'?'此操作會刪除這位勇者的全部成績與帳號。':'此操作會清除所有關卡進度、神器、金幣、改名券與支線次數。'} 操作後無法復原。</p><div class="actionrow"><button class="btn red" data-action="admin-confirm">確定${d.action==='delete'?'刪除':'重置'}</button><button class="btn ghost" data-action="dialog-close">取消</button></div></div></div>`;
return ''}
function render(){let html=st.view==='login'?loginHTML():st.view==='map'?mapHTML():st.view==='game'?gameHTML():st.view==='board'?boardHTML():teacherHTML();$('#app').innerHTML=html+dialogHTML(); if(st.view==='game'&&st.run?.status==='playing')refreshTimer();if(st.dialog?.kind==='side')stopTimer();}
function openDialog(kind,extra){st.dialog={kind,...extra};render()}
function closeDialog(){st.dialog=null;render()}
function sync(resp){if(resp.user&&st.role!=='teacher')st.player=resp.user;if(resp.run){if(resp.run.serverNow)clockSkew=Date.now()-resp.run.serverNow;st.run=resp.run;st.map=resp.run.map;}}
async function loginStudent(fd){
 const name=String(fd.get('name')||'').trim();if(!name){toast('請填寫勇者暱稱',true);return}
 if(savedGuestToken()&&!confirm('建立新勇者會取代這台裝置原本儲存的登入憑證。舊分數仍留在排行榜，但可能無法再找回原進度。確定建立？'))return;
 const p=await call('uiLogin',name);st.studentToken=p._studentToken||'';saveGuestToken(st.studentToken);delete p._studentToken;
 st.player=p;st.role='student';st.adminToken='';st.view='map';st.board='all';render();toast('歡迎，'+p.name+'！')
}
async function continueGuest(){const tok=savedGuestToken();if(!tok)throw Error('這台裝置目前沒有保存勇者紀錄');st.studentToken=tok;const p=await call('uiGuestResume');st.studentToken=p._studentToken||tok;delete p._studentToken;st.player=p;st.role='student';st.adminToken='';st.view='map';st.board='all';render();toast('歡迎回來，'+p.name+'！');}
async function loginTeacher(fd){const t=await call('uiAdminLogin',String(fd.get('password')));st.adminToken=t.token;st.role='teacher';st.view='teacher';st.player=null;await loadTeacher();render()}
async function boot(){try{const x=await API.call('uiBoot');st.maps=x.maps||MAP_FALLBACK;st.open=x.open||{};st.ranking=x.rankings||st.ranking;const tok=savedGuestToken();if(tok){st.studentToken=tok;try{const p=await API.call('uiGuestResume');delete p._studentToken;st.player=p;st.role='student';st.view='map';st.board='all';}catch(e){st.studentToken='';console.warn('此裝置需要重新登入勇者',e)}}}catch(e){console.warn('讀取遊戲資訊失敗',e)}render()}
async function refreshRank(){const r=await call('uiBoard');st.ranking=r;render()}
async function loadTeacher(){const r=await call('uiAdminData',st.adminToken);st.teacherData=r;st.open=r.maps||st.open;}
async function start(map){const [cl,id,t]=auth();const r=await call('uiStart',cl,id,map,t);sync(r);st.dialog=null;st.view='game';alarmed=false;render();tone('start');}
async function submit(choice,byItem){if(st.busy||st.dialog||st.run?.status!=='playing')return;const [cl,id,t]=auth();const r=await call('uiSubmit',cl,id,choice,t);sync(r);openDialog('feedback',r);tone(r.correct?'correct':'wrong');if(r.run.status==='clear'){await refreshRankSilently()}alarmed=false;}
async function refreshRankSilently(){try{st.ranking=await API.call('uiBoard')}catch(e){console.warn(e)}}
async function itemUse(name){if(st.busy||st.dialog)return;const [cl,id,t]=auth();const r=await call('uiItem',cl,id,name,t);sync(r);if(name==='bow'){openDialog('feedback',r);tone('bow');if(r.run.status==='clear')await refreshRankSilently()}else{render();tone(name);toast(name==='sword'?'龍淵聖劍斬去了兩個錯誤選項！':'回春靈咒恢復一顆愛心！')}}
async function startSide(item){const [cl,id,t]=auth();const r=await call('uiSideStart',cl,id,item,t);sync(r);openDialog('side');tone('start')}
async function endSide(choice){const [cl,id,t]=auth();const r=await call('uiSideSubmit',cl,id,choice,t);sync(r);openDialog('sideResult',r);tone(r.correct?'magic':'wrong')}
async function cancelSide(){const [cl,id,t]=auth();const r=await call('uiSideCancel',cl,id,t);sync(r);closeDialog()}
async function next(){const [cl,id,t]=auth();const r=await call('uiNext',cl,id,t);sync(r);st.dialog=null;render();}
async function renameUser(fd){const x=await call('uiRename','PUBLIC',st.player.id,fd.get('name'));st.player=x;closeDialog();toast('冒險暱稱已更新！');await refreshRankSilently()}
async function adminAct(kind,data){await call('uiAdminAction',st.adminToken,kind,data);st.dialog=null;await loadTeacher();st.ranking=await API.call('uiBoard');render();toast('教師管理操作已完成')}
function stopTimer(){/* 視覺計時器由定時檢查目前狀態控制 */}
let timedOut=false;function refreshTimer(){const r=st.run,q=r?.question;if(!q||r.status!=='playing'||st.dialog||st.busy)return;const elapsed=Math.max(0,Math.floor((Date.now()-clockSkew-q.started)/1000)),remain=Math.max(0,q.limits.seconds-elapsed);const num=$('#sec'),fill=$('#timerfill');if(num){num.textContent=remain;num.classList.toggle('danger',remain<=10)}if(fill)fill.style.width=(remain/q.limits.seconds*100)+'%';if(remain===0&&!st.busy&&!timedOut){timedOut=true;submit(-1).finally(()=>{timedOut=false})}}
function audioStore(){try{localStorage.setItem('guoxue_audio_prefs',JSON.stringify({music:musicAutoStart,sfx:sfxEnabled,volume}))}catch(e){}}
function ensureAudio(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;audio=new AC()}if(audio.state==='suspended')audio.resume();return true}
const tunes={map:[[0,3,7,10],[0,5,7,12],[-2,2,5,9]],game:[[0,4,7,12],[2,5,9,12],[-1,3,7,10]],boss:[[0,3,6,9],[-2,1,6,10],[-4,0,3,8]]};
function playTone(freq,dur=.16,type='triangle',gain=.13,delay=0){if(!audio)return;const t=audio.currentTime+delay,osc=audio.createOscillator(),g=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0003,gain*volume),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g);g.connect(audio.destination);osc.start(t);osc.stop(t+dur+.02)}
function tone(what){if(!sfxEnabled||!ensureAudio())return;const notes={correct:[[523,0],[659,.09],[784,.18]],wrong:[[350,0],[261,.1]],sword:[[685,0],[370,.11]],bow:[[330,0],[880,.18]],heal:[[524,0],[660,.08],[988,.16]],magic:[[660,0],[880,.14],[1048,.28]],start:[[392,0],[523,.1],[659,.2]]}[what]||[];notes.forEach(([f,t])=>playTone(f,.23,'sine',.21,t))}
function musicTick(){if(!musicEnabled||!ensureAudio())return;const key=st.view==='game'?(st.run?.map===8?'boss':'game'):'map';const pat=tunes[key],notes=pat[Math.floor(themeStep/4)%pat.length],offset=notes[themeStep%4];const base=key==='boss'?185:key==='game'?220:196;playTone(base*2**(offset/12),.36,'triangle',.08);if(themeStep%4===0)playTone(base/2,.7,'sine',.035);themeStep++}
function beginMusicFromGesture(){if(musicEnabled||!musicAutoStart)return;if(!ensureAudio()){musicAutoStart=false;toast('這個瀏覽器不支援播放音樂',true);return}musicEnabled=true;themeStep=0;musicTick();clearInterval(musicTimer);musicTimer=setInterval(musicTick,470);audioStore()}
function musicSwitch(){if(musicEnabled){musicEnabled=false;musicAutoStart=false;clearInterval(musicTimer);musicTimer=null}else{musicAutoStart=true;beginMusicFromGesture()}audioStore();render()}
function logout(){if(st.role==='teacher')st.adminToken='';st.studentToken='';st.player=null;st.role='student';st.run=null;st.dialog=null;st.view='login';st.mode='student';render()}
document.addEventListener('submit',async e=>{if(!['studentForm','teacherForm','renameForm','adminForm'].includes(e.target.getAttribute('id')))return;e.preventDefault();if(st.busy)return;const id=e.target.getAttribute('id'),fd=new FormData(e.target);if((id==='studentForm'||id==='teacherForm')&&musicAutoStart)beginMusicFromGesture();try{if(id==='studentForm')await loginStudent(fd);else if(id==='teacherForm')await loginTeacher(fd);else if(id==='renameForm')await renameUser(fd);else if(id==='adminForm'){const isAdd=st.dialog.kind==='adminAdd';await adminAct('rename',{cl:'PUBLIC',id:fd.get('id'),name:fd.get('name')})}}catch(e){console.error(e)}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||st.busy)return;const a=b.dataset.action,v=b.dataset.value;try{switch(a){case 'login-tab':st.mode=v;render();break;case 'guest-continue':await continueGuest();break;case 'nav':st.view=v;st.dialog=null;st.run=null;if(v==='teacher')await loadTeacher();if(v==='board')await refreshRankSilently();render();break;case 'logout':logout();break;case 'map':st.map=Number(v);await start(st.map);break;case 'answer':b.classList.add('submitting');await submit(Number(v));break;case 'next':await next();break;case 'dialog-next':st.dialog=null;render();break;case 'back-map':st.dialog=null;st.view='map';st.run=null;render();break;case 'restart':st.dialog=null;await start(st.map);break;case 'leave':if(confirm('離開這張地圖？未通關分數不列入排行榜；支線使用次數仍會保留。')){st.view='map';st.run=null;render()}break;case 'side-open':openDialog('sidePick');break;case 'side-start':await startSide(v);break;case 'side-answer':await endSide(Number(v));break;case 'side-cancel':await cancelSide();break;case 'side-result-close':closeDialog();break;case 'item':await itemUse(v);break;case 'dialog-close':closeDialog();break;case 'board-tab':st.board=v;render();break;case 'board-kind':st.boardKind=v;render();break;case 'refresh':await refreshRank();toast('排行榜已更新');break;case 'rename-open':openDialog('rename');break;case 'teacher-class':st.teacherFilter=v;render();break;case 'admin-refresh':await loadTeacher();render();break;case 'admin-rename':{const u=st.teacherData.users.find(u=>u.id===v);openDialog('adminRename',{id:v,name:u?.name||''});break;}case 'admin-reset':openDialog('confirm',{action:'reset',id:v});break;case 'admin-delete':openDialog('confirm',{action:'delete',id:v});break;case 'admin-confirm':await adminAct(st.dialog.action,{cl:'PUBLIC',id:st.dialog.id});break;case 'toggle-map':await adminAct('toggle',{map:Number(v),open:!st.open[v]});break;case 'music':musicSwitch();break;case 'sfx':sfxEnabled=!sfxEnabled;audioStore();render();break;default:break}}catch(err){console.error(err)}});
document.addEventListener('input',e=>{if(e.target.id==='vol'){volume=Number(e.target.value)/100;audioStore()}});
document.addEventListener('change',e=>{if(e.target.id==='board-map-select'){st.boardMap=Number(e.target.value);render()}});
setInterval(refreshTimer,350);
boot();
})();

</script></body></html>
